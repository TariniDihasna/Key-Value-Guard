syntax = "proto3";

package keyvalueguard;

option java_multiple_files = true;
option java_package = "kvguard.proto";
option java_outer_classname = "ClusterProto";

// ---------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------

enum Operation {
  OP_UNKNOWN = 0;
  OP_PUT     = 1;  // set the value, always allowed
  OP_DELETE  = 2;  // remove the key
  OP_CAS     = 3;  // compare-and-set: write only if current version == expected_version
  OP_NOOP    = 4;  // leader appends one when elected, to commit earlier entries
}

// One entry in the replicated log. Owned by Role 2 (log) and Role 4 (content).
message LogEntry {
  int64     term             = 1;  // term in which the leader created the entry
  int64     index            = 2;  // position in the log, starting at 1
  string    request_id       = 3;  // unique per client request, used to avoid duplicates
  string    client_id        = 4;
  Operation op               = 5;
  string    key              = 6;
  string    value            = 7;
  int64     expected_version = 8;  // only used by OP_CAS; 0 means "key must not exist"
  int64     lamport          = 9;  // Lamport timestamp (Role 1)
  int64     wall_time_ms     = 10; // node time when created (skewed clock), for ordering checks
}

// ---------------------------------------------------------------
// Role 2: Consensus (node to node)
// ---------------------------------------------------------------

service ConsensusService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  // Also used as the leader heartbeat when `entries` is empty.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestVoteRequest {
  int64  term           = 1;
  string candidate_id   = 2;
  int64  last_log_index = 3;
  int64  last_log_term  = 4;
  int64  lamport        = 5;
}

message RequestVoteResponse {
  int64 term         = 1;  // responder's current term
  bool  vote_granted = 2;
  int64 lamport      = 3;
}

message AppendEntriesRequest {
  int64  term           = 1;
  string leader_id      = 2;
  int64  prev_log_index = 3;
  int64  prev_log_term  = 4;
  repeated LogEntry entries = 5;
  int64  leader_commit  = 6;  // highest index the leader has committed
  int64  lamport        = 7;
}

message AppendEntriesResponse {
  int64 term        = 1;
  bool  success     = 2;  // false if prev_log_index/term did not match
  int64 match_index = 3;  // follower's last matching index, helps catch-up
  int64 lamport     = 4;
}

// ---------------------------------------------------------------
// Role 3: Failure detection (node to node)
// ---------------------------------------------------------------

service FailureDetectionService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string sender_id = 1;
  int64  lamport   = 2;
  int64  sent_ms   = 3;
}

message PingResponse {
  string node_id = 1;
  string role    = 2;  // "LEADER", "FOLLOWER" or "CANDIDATE"
  int64  term    = 3;
  int64  lamport = 4;
}

// ---------------------------------------------------------------
// Role 1: Time synchronisation (node to node)
// ---------------------------------------------------------------

service TimeService {
  // Cristian's algorithm: the caller records send time t0 and receive time t1,
  // then sets its clock to server_time_ms + (t1 - t0) / 2.
  rpc GetTime(TimeRequest) returns (TimeResponse);
}

message TimeRequest {
  string sender_id = 1;
}

message TimeResponse {
  int64 server_time_ms = 1;
  int64 lamport        = 2;
}

// ---------------------------------------------------------------
// Role 4: Client API (client to any node)
// ---------------------------------------------------------------

service ClientService {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc Get(GetRequest) returns (GetResponse);
}

message SubmitRequest {
  string    request_id       = 1;  // unique; resend the same id when retrying
  string    client_id        = 2;
  Operation op               = 3;  // OP_PUT, OP_DELETE or OP_CAS
  string    key              = 4;
  string    value            = 5;
  int64     expected_version = 6;  // only for OP_CAS; 0 means "key must not exist"
}

enum Status {
  STATUS_UNKNOWN   = 0;
  OK               = 1;  // committed and applied
  NOT_LEADER       = 2;  // retry at leader_hint
  VERSION_MISMATCH = 3;  // CAS lost the race: the key is no longer at expected_version
  KEY_NOT_FOUND    = 4;  // GET or DELETE on a key that does not exist
  NO_QUORUM        = 5;  // could not reach a majority in time (e.g. minority partition)
  TIMEOUT          = 6;
  DUPLICATE        = 7;  // request_id already applied, original result returned
}

message SubmitResponse {
  Status status         = 1;
  string leader_hint    = 2;  // node id of the leader, if known
  int64  log_index      = 3;  // index of the committed entry
  int64  current_version = 4; // version of the key after this request (or current one on mismatch)
  string message        = 5;
  string served_by      = 6;  // node that answered
}

enum ReadMode {
  READ_STRONG = 0;  // only the leader answers, guaranteed latest committed value
  READ_STALE  = 1;  // any node answers from its local state, may be behind
}

message GetRequest {
  string   key  = 1;
  ReadMode mode = 2;
}

message GetResponse {
  Status status        = 1;
  bool   found         = 2;  // false if the key does not exist
  string value         = 3;
  int64  version       = 4;  // log index of the last change to this key
  int64  applied_index = 5;  // how far this node has applied the log (shows staleness)
  string leader_hint   = 6;
  string served_by     = 7;
}

// ---------------------------------------------------------------
// Role 3: Fault injection and status (used by scripts and the demo)
// ---------------------------------------------------------------

service AdminService {
  rpc SetFault(FaultConfig) returns (FaultAck);
  rpc GetStatus(StatusRequest) returns (NodeStatus);
}

message FaultConfig {
  repeated string blocked_peers = 1;  // drop all traffic to/from these node ids (partition)
  int32  delay_ms               = 2;  // add this delay to every outgoing message
  double drop_probability       = 3;  // 0.0 to 1.0, random message loss
  int64  clock_skew_ms          = 4;  // shift this node's clock (Role 1 applies it)
  bool   clear_all              = 5;  // reset everything to normal
}

message FaultAck {
  bool   ok      = 1;
  string message = 2;
}

message StatusRequest {}

message NodeStatus {
  string node_id        = 1;
  string role           = 2;
  int64  term           = 3;
  string leader_id      = 4;
  int64  commit_index   = 5;
  int64  last_applied   = 6;
  int64  last_log_index = 7;
  int64  lamport        = 8;
  int64  clock_skew_ms  = 9;
  repeated string suspected_peers = 10;
}
